<!DOCTYPE html>
<html>
<head>
  <title>CIC Reset Password</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
</head>
<body>

  <form id="resetForm" class="container">
    <div class="mt-4">
        <h1>Reset Password - (Customer Info Central)</h1>
    </div>
    <div id="errorMessage" class="mt-2 text-danger"></div>
    <div class="mt-4">
      <label>New Password:</label>
      <input class="form-control" type="password" name="newPassword" required>
    </div>
    <div class="mt-2">
      <label>Confirm Password:</label>
      <input class="form-control" type="password" name="confirmPassword" required>
    </div>
    <div class="mt-3">
      <button class="btn btn-info" type="submit">Reset Password</button>
    </div>
    <div id="successMessage" class="mt-3 d-none">
      <h4>Password reset successfully! You can now login with your new password.</h4>
    </div>
  </form>

  <script src="./resetpassword.js"></script>
</body>
</html>
